name: Build, verify, and publish signed STATE plugin

on:
  push:
    tags:
      - 'v*-hustnlp'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag for this HUSTNLP compatibility build
        required: true
        default: v0.3.5-hustnlp

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
  PLUGIN_PACKAGE: artifacts/sub2api-state-kit_plugin_v0.3.5.s2plugin

concurrency:
  group: state-kit-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag
        run: test "$RELEASE_TAG" = "v0.3.5-hustnlp"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: plugin/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Backend race tests and UI bridge tests
        working-directory: plugin
        run: |
          go test -race ./... -count=1
          node --test ui-tests/*.test.cjs
      - name: Build and sign plugin package
        env:
          SIGNING_KEY_B64: ${{ secrets.STATE_KIT_RELEASE_PRIVATE_KEY_B64 }}
        run: |
          test -n "$SIGNING_KEY_B64"
          KEY_PATH="$RUNNER_TEMP/state-kit-release.pem"
          trap 'rm -f "$KEY_PATH"' EXIT
          printf '%s' "$SIGNING_KEY_B64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          python3 scripts/package_plugin.py build --private-key "$KEY_PATH" --output artifacts
      - name: Verify package signature and checksums
        run: |
          python3 scripts/package_plugin.py verify --package "$PLUGIN_PACKAGE"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          artifacts = Path('artifacts')
          expected = {
              line.split(maxsplit=1)[1].strip(): line.split()[0]
              for line in (artifacts / 'SHA256SUMS').read_text().splitlines()
          }
          for name, digest in expected.items():
              actual = hashlib.sha256((artifacts / name).read_bytes()).hexdigest()
              assert actual == digest, f'Checksum mismatch: {name}'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: signed-plugin-release
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

  native-verification:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: plugin/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: signed-plugin-release
          path: artifacts
      - name: Verify signed package
        run: python3 scripts/package_plugin.py verify --package "$PLUGIN_PACKAGE"
      - name: Check packaged runtime matches this source
        env:
          ARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          (cd plugin && go build -trimpath -buildvcs=false -ldflags='-s -w' -o ../rebuilt-state-kit ./cmd/state-kit)
          python3 - <<'PY'
          import hashlib, os, zipfile
          from pathlib import Path
          package = 'artifacts/sub2api-state-kit_plugin_v0.3.5.s2plugin'
          with zipfile.ZipFile(package) as archive:
              delivered = archive.read('runtimes/linux-' + os.environ['ARCH'] + '/state-kit')
          rebuilt = Path('rebuilt-state-kit').read_bytes()
          assert hashlib.sha256(delivered).digest() == hashlib.sha256(rebuilt).digest(), 'Release binary differs from source build'
          PY
      - name: Load with stock Sub2API v0.2.7 installer and process runtime
        run: |
          git clone --depth 1 --branch v0.2.7 https://github.com/Wei-Shaw/sub2api.git stock-host
          test "$(git -C stock-host rev-parse HEAD)" = aea725f2ea644d5592d0bbb1d63b607efa7e200a
          python3 plugin/integration/run_host_contract.py --host-src stock-host --package "$PLUGIN_PACKAGE" --public-key plugin/release/publisher-public-key.txt --log host-contract.log
      - name: Verify optional host directory adapter
        run: |
          python3 scripts/prepare_plugin_host.py --upstream stock-host --output directory-host
          cd directory-host/backend
          go test ./internal/service -run 'TestPlugin(Resource|Host)|TestBuildHostServices' -count=1
      - uses: pnpm/action-setup@v4
        if: matrix.arch == 'amd64'
        with:
          version: 10
      - name: Build adapted host UI and check types
        if: matrix.arch == 'amd64'
        working-directory: directory-host/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-native-${{ matrix.arch }}
          path: host-contract.log
          if-no-files-found: ignore

  publish:
    needs: native-verification
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-plugin-release
          path: artifacts
      - name: Publish compatibility release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "STATE Kit v0.3.5 HUSTNLP dynamic proxy pool" \
            --notes "Adds ordered renewal-led automatic and manual dynamic proxy selection, 191 GeoNode country choices, and automatic country failover when at least 20% of configured models remain unavailable after a full attempt round. The first renewing ticket leads later normal country changes; failure failover is de-duplicated against the same ticket generation. Existing valid tickets are preserved." \
            --prerelease
